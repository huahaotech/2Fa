name: Android Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK 34
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:?Android SDK is missing from the runner}"
          SDK_MANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          test -x "$SDK_MANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          if [[ ! -f "$SDK_ROOT/platforms/android-34/android.jar" || ! -x "$SDK_ROOT/build-tools/34.0.0/aapt2" ]]; then
            "$SDK_MANAGER" --install "platforms;android-34" "build-tools;34.0.0"
          fi
          test -f "$SDK_ROOT/platforms/android-34/android.jar"
          test -x "$SDK_ROOT/build-tools/34.0.0/aapt2"

      - name: Decode keystore (from secret) if provided
        shell: bash
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding keystore..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > ./keystore.jks
            chmod 600 ./keystore.jks
          else
            echo "No KEYSTORE_BASE64 secret provided; skipping keystore decode."
          fi

      - name: Verify keystore present
        run: ls -l ./keystore.jks || true

      - name: Download and install Gradle 8.2
        run: |
          wget https://services.gradle.org/distributions/gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH
          gradle --version

      - name: Build with Gradle 8.2
        env:
          KEYSTORE_FILE: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          export PATH=$PWD/gradle-8.2/bin:$PATH
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Upload build log
        if: always() && hashFiles('build.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: List APK files
        run: find . -name "*.apk" -type f 2>/dev/null || echo "No APK files found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: authenticator-debug
          path: app/build/outputs/apk/debug/*.apk
